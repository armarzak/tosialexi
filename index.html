<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Тося и Гав-Патруль</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
@font-face{font-family:"Press Start 2P";src:url("PressStart2P-Regular.ttf") format("truetype");font-display:block}
/* Layout: one full-screen pixel canvas, letterboxed; touch pads overlay at the bottom on phones */
:root{--bg:#120d1c;--pad:#ffffff22;--padfg:#fff;--padline:#ffffff55;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#tc{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
#tc.on{display:flex}
.pad{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}
.pad.l{width:170px}
.pad button{width:54px;height:54px;border-radius:50%;border:2px solid var(--padline);background:var(--pad);color:var(--padfg);font:9px "Press Start 2P",monospace;touch-action:none;padding:0}
.pad.r{width:186px;justify-content:flex-end}
.pad button.act{background:#ffffff55}
#tp{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:40px;height:40px;border-radius:8px;border:2px solid var(--padline);background:var(--pad);color:var(--padfg);font:10px "Press Start 2P",monospace;display:none;pointer-events:auto}
#tc.on ~ #tp{display:block}
</style>
</head>
<body>
<canvas id="c" aria-label="Игра Тося и Гав-Патруль"></canvas>
<div id="tc">
  <div class="pad l"><button data-k="left" data-m="ArrowLeft" aria-label="Влево">◀</button><button data-k="down" data-m="ArrowDown" aria-label="Вниз">▼</button><button data-k="right" data-m="ArrowRight" aria-label="Вправо">▶</button></div>
  <div class="pad r"><button data-k="swap" aria-label="Сменить собаку">СМЕН</button><button data-k="super" aria-label="Супер-гав">★</button><button data-k="bark" aria-label="Гав">ГАВ</button><button data-k="paw" aria-label="Атака">АТК</button><button data-k="jump" data-m="Enter" aria-label="Прыжок">ПРЫГ</button></div>
</div>
<button id="tp" data-k="start" data-m="Escape" aria-label="Пауза">II</button>
<script>
'use strict';
// ================= CORE =================
const W=480,H=270,GY=234;
const cvs=document.getElementById('c'),MAIN=cvs.getContext('2d');let ctx=MAIN;
cvs.width=W;cvs.height=H;
const FONT='"Press Start 2P", monospace';
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cvs.style.width=Math.floor(W*s)+'px';cvs.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rnd=(a,b)=>a+Math.random()*(b-a);
const sgn=v=>v<0?-1:1;
function hash(n){n=Math.imul(n|0,374761393)+668265263|0;n=Math.imul(n^(n>>>13),1274126177);n=n^(n>>>16);return (n>>>0)/4294967296}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function txt(s,x,y,sz=8,c='#fff',al='left',sh='#000'){ctx.font=sz+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';if(sh){ctx.fillStyle=sh;ctx.fillText(s,x+1,y+1)}ctx.fillStyle=c;ctx.fillText(s,x,y)}
function wrap(s,maxW,sz){ctx.font=sz+'px '+FONT;const out=[];for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line)}return out}
function dk(h,f=.75){const n=parseInt(h.slice(1,7),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return '#'+((1<<24)|(c(n>>16)<<16)|(c(n>>8&255)<<8)|c(n&255)).toString(16).slice(1)}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
// sprite cache with dark outline + white flash variant
const SPR=new Map();
function sprite(key,w,h,ox,oy,fn){let s=SPR.get(key);if(s)return s;
 const base=mk(w,h),bg=base.getContext('2d');const prev=ctx;ctx=bg;bg.translate(ox,oy);try{fn()}finally{ctx=prev}
 const sil=mk(w,h),sg=sil.getContext('2d');sg.drawImage(base,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle='#170f20';sg.fillRect(0,0,w,h);
 const out=mk(w+2,h+2),og=out.getContext('2d');og.drawImage(sil,0,1);og.drawImage(sil,2,1);og.drawImage(sil,1,0);og.drawImage(sil,1,2);og.drawImage(base,1,1);
 const wh=mk(w+2,h+2),wg=wh.getContext('2d');wg.drawImage(out,0,0);wg.globalCompositeOperation='source-in';wg.fillStyle='#ffffff';wg.fillRect(0,0,w+2,h+2);
 s={c:out,w:wh,ox:ox+1,oy:oy+1};SPR.set(key,s);return s}
function blit(s,x,y,dir=1,o={}){const c=MAIN;c.save();c.translate(Math.round(x),Math.round(y));if(o.rot)c.rotate(o.rot);const sc=o.sc||1;if(dir<0||sc!==1)c.scale(dir*sc,sc);if(o.a!=null)c.globalAlpha=o.a;c.drawImage(o.white?s.w:s.c,-s.ox,-s.oy);c.restore()}
function strip(w,h,fn){const c=mk(w,h);const prev=ctx;ctx=c.getContext('2d');try{fn(w,h)}finally{ctx=prev}return c}
function wrapAt(sw,x,iw,fn){fn(x);if(x+iw>sw)fn(x-sw);if(x<0)fn(x+sw)}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function hex2rgb(h){const n=parseInt(h.slice(1,7),16);return[n>>16,n>>8&255,n&255]}
function skyCanvas(cols,h=GY){const c=mk(W,h),g=c.getContext('2d'),id=g.createImageData(W,h),d=id.data,rgb=cols.map(hex2rgb),n=cols.length-1;
 for(let y=0;y<h;y++){const t=y/(h-1)*n,i=Math.min(n-1,t|0),f=t-i;for(let x=0;x<W;x++){const th=(BAYER[(y&3)*4+(x&3)]+.5)/16;const col=rgb[f>th?i+1:i];const k=(y*W+x)*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255}}
 g.putImageData(id,0,0);return c}
function dith(x,y,w,h,c,lvl){ctx.fillStyle=c;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if((BAYER[((y+j)&3)*4+((x+i)&3)]+.5)/16<lvl)ctx.fillRect(x+i,y+j,1,1)}

// ================= INPUT =================
const ACTS=[['left','Влево'],['right','Вправо'],['jump','Прыжок'],['down','Вниз / лечь'],['paw','Атака'],['bark','Гав'],['super','Супер-гав'],['swap','Сменить собаку'],['start','Пауза']];
const DEFB={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],jump:['Space','ArrowUp'],down:['ArrowDown','KeyS'],paw:['KeyZ','KeyJ'],bark:['KeyX','KeyK'],super:['KeyC','KeyL'],swap:['KeyQ','Tab'],start:['Enter','KeyP']};
let BIND=JSON.parse(JSON.stringify(DEFB));
try{const s=JSON.parse(localStorage.getItem('tosya_keys')||'null');if(s)for(const a in DEFB)if(Array.isArray(s[a]))BIND[a]=[s[a][0]||'',s[a][1]||'']}catch(e){}
let C2A={};function rebuildBind(){C2A={};for(const a in BIND)for(const c of BIND[a])if(c)(C2A[c]=C2A[c]||[]).push(a)}rebuildBind();
function saveBind(){try{localStorage.setItem('tosya_keys',JSON.stringify(BIND))}catch(e){}}
function keyName(c){if(!c)return '—';const m={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Space:'ПРОБЕЛ',Enter:'ENTER',Escape:'ESC',Tab:'TAB',ShiftLeft:'L-SHIFT',ShiftRight:'R-SHIFT',ControlLeft:'L-CTRL',ControlRight:'R-CTRL',AltLeft:'L-ALT',AltRight:'R-ALT',Backspace:'BKSP',Comma:',',Period:'.',Slash:'/',Semicolon:';',Quote:"'",BracketLeft:'[',BracketRight:']',Minus:'-',Equal:'='};
 if(m[c])return m[c];if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);if(c.startsWith('Numpad'))return 'NUM'+c.slice(6);return c.toUpperCase().slice(0,8)}
const keys={},pressed={};let raw={};let rebinding=null;
function kdown(k){if(!keys[k])pressed[k]=true;keys[k]=true}
function kup(k){keys[k]=false}
addEventListener('keydown',e=>{initAudio();
 if(rebindPad){e.preventDefault();if(e.code==='Escape')rebindPad=null;return}
 if(rebinding){e.preventDefault();if(e.code!=='Escape'){for(const a in BIND)BIND[a]=BIND[a].map(c=>c===e.code?'':c);BIND[rebinding.a][rebinding.s]=e.code;rebuildBind();saveBind();S.coin()}rebinding=null;return}
 if(!e.repeat)raw[e.code]=true;
 if(e.code==='KeyM'&&!e.repeat)toggleMute();
 const a=C2A[e.code];if(a){a.forEach(kdown);e.preventDefault()}
 if(/^(Arrow|Space|Tab)/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>{const a=C2A[e.code];if(a)a.forEach(kup)});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,m=b.dataset.m;
 b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();b.classList.add('act');kdown(k);if(m)raw[m]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{b.classList.remove('act');kup(k)}))});
cvs.addEventListener('pointerdown',e=>{initAudio();if(G.state!=='play'&&e.pointerType!=='touch')raw.Enter=true});
const touchUI=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(touchUI)document.getElementById('tc').classList.add('on');
// ---- gamepad (PlayStation / Xbox, standard mapping) ----
const PADDEF={jump:[0],bark:[1],paw:[2],super:[3],swap:[4,5],start:[9,17]};
let PADB=JSON.parse(JSON.stringify(PADDEF));
try{const s=JSON.parse(localStorage.getItem('tosya_pad')||'null');if(s)for(const a in PADDEF)if(Array.isArray(s[a]))PADB[a]=s[a]}catch(e){}
function savePad(){try{localStorage.setItem('tosya_pad',JSON.stringify(PADB))}catch(e){}}
let curPad=null,padPS=true,padPrev={},padBtnPrev=[],rebindPad=null,toast={s:'',t:0};
const isPS=id=>/054c|playstation|dualsense|dualshock|wireless controller/i.test(id||'');
function padName(i){if(i==null)return '—';const ps=['✕','○','□','△','L1','R1','L2','R2','SHARE','OPTIONS','L3','R3','↑','↓','←','→','PS','TOUCH'],xb=['A','B','X','Y','LB','RB','LT','RT','BACK','START','LS','RS','↑','↓','←','→','HOME'];return (padPS?ps:xb)[i]||('B'+i)}
addEventListener('gamepadconnected',e=>{padPS=isPS(e.gamepad.id);toast={s:padPS?'Джойстик PlayStation подключён!':'Геймпад подключён!',t:200};initAudio()});
addEventListener('gamepaddisconnected',()=>{toast={s:'Геймпад отключён',t:150};for(const k in keys)keys[k]=false;padPrev={}});
function rumble(s,d){try{if(window.Android&&Android.rumble){Android.rumble(d|0);return}if(curPad&&curPad.vibrationActuator)curPad.vibrationActuator.playEffect('dual-rumble',{duration:d,strongMagnitude:s,weakMagnitude:s*.6})}catch(e){}}
function pollPad(){let gp=null;try{const gps=navigator.getGamepads?navigator.getGamepads():[];for(const g of gps)if(g&&g.connected!==false){gp=g;break}}catch(e){}if(!gp&&window.NATIVE_PAD)gp=window.NATIVE_PAD;curPad=gp;if(!gp)return;padPS=isPS(gp.id);
 const b=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.5));
 const now=gp.buttons.map((_,i)=>b(i)),edge=i=>now[i]&&!padBtnPrev[i];
 if(rebindPad){for(let i=0;i<now.length;i++)if(edge(i)&&(i<12||i>15)){for(const a in PADB)PADB[a]=PADB[a].filter(x=>x!==i);PADB[rebindPad]=[i];savePad();S.coin();rebindPad=null;break}padBtnPrev=now;return}
 const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
 const st={left:b(14)||ax<-.45,right:b(15)||ax>.45,down:b(13)||ay>.55,up:b(12)||ay<-.55};
 for(const a in PADB)st[a]=PADB[a].some(i=>now[i]);
 for(const k in st){if(st[k]&&!padPrev[k]){initAudio();if(k!=='up')kdown(k);const m={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[k];if(m)raw[m]=true}
  if(!st[k]&&padPrev[k]&&k!=='up')kup(k)}
 if(edge(0))raw.PadOk=true;if(edge(1))raw.PadBack=true;
 padPrev=st;padBtnPrev=now}
const M={up:()=>raw.ArrowUp||raw.KeyW,down:()=>raw.ArrowDown||raw.KeyS,left:()=>raw.ArrowLeft||raw.KeyA,right:()=>raw.ArrowRight||raw.KeyD,ok:()=>raw.Enter||raw.Space||raw.NumpadEnter||raw.PadOk,back:()=>raw.Escape||raw.Backspace||raw.PadBack};

// ================= AUDIO =================
let AC=null,master=null,muted=false,NB=null;
try{muted=localStorage.getItem('tosya_mute')==='1'}catch(e){}
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;try{localStorage.setItem('tosya_mute',muted?'1':'0')}catch(e){}}
const T=()=>AC?AC.currentTime:0;
function tone(f,d,type='square',v=.08,slide=0,at=0){if(!AC||muted)return;const t=at||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d,v=.1,fq=1200,at=0){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=at||AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=fq;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const S={
 jump(){tone(330,.14,'square',.05,420)},
 bark(p=1){const t=T();tone(640*p,.07,'sawtooth',.1,-320*p,t);tone(560*p,.1,'square',.08,-300*p,t+.08);noise(.08,.08,900,t)},
 superb(){const t=T();for(let i=0;i<3;i++){tone(720-i*90,.13,'sawtooth',.12,-400,t+i*.11);noise(.12,.12,700,t+i*.11)}},
 paw(){noise(.07,.12,2600)},
 drool(){const t=T();noise(.12,.1,500,t);tone(200,.12,'sine',.08,-120,t)},
 dash(){const t=T();noise(.25,.1,1800,t);tone(300,.2,'square',.05,500,t)},
 swap(){const t=T();[523,784,1047].forEach((f,i)=>tone(f,.06,'triangle',.06,0,t+i*.04))},
 hit(){tone(180,.1,'square',.08,-80);noise(.06,.1,600)},
 stomp(){tone(220,.08,'square',.08,300);noise(.05,.08,400)},
 coin(){const t=T();tone(988,.05,'square',.04,0,t);tone(1319,.1,'square',.04,0,t+.05)},
 heal(){const t=T();[523,659,784,1047].forEach((f,i)=>tone(f,.08,'square',.05,0,t+i*.06))},
 hurt(){tone(440,.25,'square',.08,-300)},
 bell(){const t=T();tone(1760,.12,'triangle',.05,0,t);tone(1760,.15,'triangle',.05,0,t+.12)},
 clink(){tone(1300,.06,'square',.04,-300)},
 boss(){tone(110,.3,'sawtooth',.1,-50);noise(.2,.1,300)},
 boom(){noise(.6,.22,200);tone(80,.5,'sawtooth',.1,-40)},
 toss(){tone(500,.08,'triangle',.04,200)},
 menu(){tone(660,.05,'square',.04)},
 cp(){const t=T();[392,523,659,784].forEach((f,i)=>tone(f,.1,'square',.05,0,t+i*.08))},
 oneup(){const t=T();[659,784,1319,1047,1175,1568].forEach((f,i)=>tone(f,.08,'square',.05,0,t+i*.07))},
 die(){const t=T();[523,494,466,440,415,392,370,349].forEach((f,i)=>tone(f,.12,'square',.06,0,t+i*.1))},
 win(){const t=T();[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.06,0,t+i*.12))},
};
function seq(s){return s.trim().split(/\s+/).map(t=>{const m=/^([A-G])(#?)(\d)$/.exec(t);if(!m)return 0;return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0)})}
const SONGS={
 city:{bpm:150,mel:seq('E5 - G5 E5 C5 - D5 E5 F5 - E5 D5 C5 - G4 - E5 - G5 E5 C5 - D5 E5 F5 E5 D5 B4 C5 - - -'),bass:seq('C3 - G3 - C3 - G3 - F3 - C4 - G3 - G2 - C3 - G3 - C3 - G3 - F3 - G3 - C3 - C3 -')},
 school:{bpm:144,mel:seq('C5 - C5 D5 E5 - C5 - E5 F5 G5 - - - G5 - A5 G5 F5 E5 D5 - G4 - C5 - E5 D5 C5 - - -'),bass:seq('C3 - G3 - C3 - G3 - C3 - G3 - E3 - G3 - F3 - C3 - G2 - D3 - C3 - G2 - C3 - G3 -')},
 forest:{bpm:128,mel:seq('A4 - C5 - E5 - D5 C5 B4 - G4 - A4 - - - C5 - E5 - A5 - G5 E5 F5 - D5 - E5 - - -'),bass:seq('A2 - E3 - A2 - E3 - G2 - D3 - A2 - E3 - F2 - C3 - G2 - D3 - E2 - B2 - A2 - E3 -')},
 park:{bpm:156,mel:seq('G4 B4 D5 B4 G4 B4 D5 G5 F#5 - D5 - A4 - - - E5 G5 E5 C5 D5 - B4 - A4 B4 C5 D5 G4 - - -'),bass:seq('G2 - D3 - G2 - D3 - D3 - A2 - D3 - A2 - C3 - G2 - G2 - D3 - D3 - A2 - G2 - D3 -')},
 vet:{bpm:132,mel:seq('D5 - F5 - A5 - F5 - G5 - E5 - C5 - - - D5 - F5 - A5 - C6 - A5 G5 F5 E5 D5 - - -'),bass:seq('D3 - A3 - D3 - A3 - C3 - G3 - C3 - G3 - A#2 - F3 - A2 - E3 - D3 - A3 - D3 - A3 -')},
 home:{bpm:116,mel:seq('E4 - G4 - B4 - A4 - G4 - E4 - F#4 - - - E4 - G4 - B4 - D5 - C5 - B4 - A4 - B4 -'),bass:seq('E2 - B2 - E2 - B2 - C3 - G2 - B2 - F#2 - E2 - B2 - E2 - B2 - A2 - E3 - B2 - B2 -')},
 boss:{bpm:176,mel:seq('E4 E4 G4 E4 A#4 - A4 - E4 E4 G4 E4 B4 - A#4 - E4 E4 G4 E4 D5 - C5 - B4 A#4 A4 G4 E4 - - -'),bass:seq('E2 - E2 - E2 - E2 - E2 - E2 - E2 - E2 - G2 - G2 - A2 - A2 - E2 - E2 - B2 - B2 -')},
 title:{bpm:140,mel:seq('C5 E5 G5 E5 C5 E5 G5 C6 B5 - G5 - D5 - - - A4 C5 F5 C5 A4 C5 F5 A5 G5 - E5 - C5 - - -'),bass:seq('C3 - G3 - C3 - G3 - G2 - D3 - G2 - D3 - F2 - C3 - F2 - C3 - G2 - D3 - C3 - G3 -')},
};
const music={song:null,step:0,next:0};
function playSong(s){music.song=SONGS[s]||null;music.step=0;music.next=AC?AC.currentTime+.08:0}

setInterval(()=>{if(!AC||!music.song||muted)return;const s=music.song,dt=60/s.bpm/2;if(music.next<AC.currentTime)music.next=AC.currentTime+.02;
 while(music.next<AC.currentTime+.15){const i=music.step;const n=s.mel[i%s.mel.length],b=s.bass[i%s.bass.length];
  if(n)tone(mtof(n),dt*.9,'square',.03,0,music.next);if(b)tone(mtof(b),dt*.95,'triangle',.07,0,music.next);
  if(i%4===2)noise(.03,.025,6000,music.next);music.next+=dt;music.step++}},40);

// ================= STATE =================
const G={state:'title',t:0,level:0,score:0,lives:3,treats:0,cp:null,banner:0,bossBanner:0,dog:'tosya',mrow:0,mcol:0,from:'title'};
let save=0;try{save=clamp(+localStorage.getItem('tosya_lvl')||0,0,9)}catch(e){}
let P,L,ents=[],projs=[],parts=[],pops=[],solids=[],plats=[],grounds=[],items=[],cps=[],decos=[],boss=null,ghosts=[];

function updProjs(){

   for(const e of ents)if(e.active&&!e.dying&&!pr.hit.has(e)){const d=Math.hypot(e.x+e.w/2-pr.x,e.y+e.h/2-pr.y);if(d<pr.r){pr.hit.add(e);hitEnemy(e,2,'ring',sgn(e.x-pr.x))}}
   if(boss&&!boss.dying&&!pr.hit.has(boss)){for(const tg of bossTargets(boss)){const bx=tg.box;const d=Math.hypot(bx.x+bx.w/2-pr.x,bx.y+bx.h/2-pr.y);if(d<pr.r+bx.w/2){pr.hit.add(boss);const src=tg.src==='nozzle'?'nozzle':'ring';if(bossVuln(boss,src)){boss.inv=0;hitBoss(boss,2,src)}else hitBoss(boss,0,src);break}}}
   for(const q of projs)if(!q.friendly&&Math.hypot(q.x-pr.x,q.y-pr.y)<pr.r){q.life=0;burst(q.x,q.y,4,['#ffffff'],1.5,.1,12)}
   continue}
  if(pr.kind==='plane'||pr.osc){pr.vy=Math.sin(pr.t*.07)*.7}
  pr.x+=pr.vx;pr.y+=pr.vy;pr.vy+=pr.g;
  if(pr.friendly){const src=pr.kind==='bark'?'bark':pr.kind==='drool'?'drool':'paw';
   for(const e of ents)if(e.active&&!e.dying&&!pr.hit.has(e)&&ov(pr,e)){pr.hit.add(e);hitEnemy(e,pr.kind==='drool'?99:1,src,sgn(pr.vx));if(pr.kind==='bark')e.stun=Math.max(e.stun,pr.stun||70);else pr.life=0}
   if(hitBossAny(pr,1,src==='drool'?'paw':src,pr.hit)&&pr.kind!=='bark')pr.life=0;
   if(pr.kind==='bark')for(const q of projs)if(!q.friendly&&q.kind!=='wave'&&ov(pr,q)){q.life=0;burst(q.x,q.y,4,['#ffffff'],1.5,.1,12)}
  }else if(ov(pr,P)){
   if(P.cone>0||P.dashT>0){pr.friendly=true;pr.vx*=-1.3;pr.vy=-2;pr.hit=new Set();pop(P.x,P.y-12,P.cone>0?'Конус-щит!':'Бац!','#88ffff')}

   burst(pr.x+4,pr.y+6,6,pr.kind==='snowball'||pr.kind==='ice'?['#ffffff','#dfe9ff']:pr.kind==='pizza'?['#f4c06a','#d64933','#fff3b0']:pr.kind==='drool'?['#cfefff','#ffffff']:['#8a5a2b','#bbbbbb'],1.6,.12,16)}

function updParts(){for(const p of parts){if(p.pull){p.x+=(p.tx-p.x)*.12;p.y+=(p.ty-p.y)*.12}else{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g}p.life--}parts=parts.filter(p=>p.life>0);

function gbUpd(b,ph2,dx){const D=GBD[b.kind],ax=L.arena;b.vy=Math.min(b.vy+.3,8);
 switch(b.state){
 case 'intro':b.dir=-1;b.vx=0;if(b.t===20){pop(b.x-80,b.y-16,D.hello,'#ffe066');S.boss()}if(b.t>80)gbGo(b,'walk');break;
 case 'walk':b.dir=sgn(dx)||b.dir;b.vx=b.dir*D.sp*(ph2?1.35:1);if(D.hop&&b.onGround&&b.t%40===20)b.vy=-3.6;if(b.hitWall&&b.onGround)b.vy=-6;
  if(ph2&&D.minion&&b.t===30&&minionCount()<2){const m=makeEnemy(D.minion,ax+30+Math.random()*(W-60),GY);m.active=true;m.minion=true;ents.push(m)}
  if(b.t>(ph2?60:90))gbGo(b,D.atk[b.ci++%D.atk.length]);break;
 case 'throw':b.vx=0;b.dir=sgn(dx)||b.dir;if(b.t%(ph2?14:20)===10&&b.t<70){bossProj(D.proj,b.x+b.w/2,b.y+6,dx+rnd(-40,40));b.arm=8}if(b.t>84)gbGo(b,'walk');break;
 case 'rain':b.vx=0;if(b.t===2)pop(b.x-20,b.y-16,'Сверху!','#ffab40');if(b.t%((ph2?10:14)+(D.rainSlow||0))===0&&b.t<84)projs.push({kind:D.proj,x:ax+20+Math.random()*(W-40),y:-10,w:8,h:8,vx:0,vy:0,g:.15,life:220,t:0});if(b.t>100)gbGo(b,'walk');break;
 case 'ring':b.vx=0;if(b.t%(ph2?30:40)===10&&b.t<100){gbWaves(b,ph2?3:2.6);shake=4;S.boom();pop(b.x-10,b.y-16,D.ringSay||'БУМ!','#ffffff')}if(b.t>112){if(D.ringTired){gbGo(b,'tired');pop(b.x-30,b.y-16,D.ouch,'#ffdd55')}else gbGo(b,'walk')}break;
 case 'charge':if(b.t<28){b.vx=0;b.dir=sgn(dx)||b.dir;if(b.t%5===0)burst(b.x+b.w/2-b.dir*16,GY-3,2,['#bdbdbd'],1,.05,12);if(b.t===2)pop(b.x-10,b.y-16,'Р-Р-Р!','#ff5252')}

 case 'slam':if(b.t===1){b.vy=-7;b.vx=clamp(dx/40,-3.2,3.2)}if(b.onGround&&b.t>8){b.vx=0;shake=6;S.boom();gbWaves(b,2.6);gbGo(b,'tired');pop(b.x-30,b.y-16,D.ouch,'#ffdd55')}break;
